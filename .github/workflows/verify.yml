name: Repository verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the verified Wormhole repository
        if: ${{ github.repository_id != '1431014094' || github.repository != 'TheSlayer455/jake-wormhole' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Check repository context and hygiene
        run: python3 scripts/verify_repository.py
      - name: Verify original acceptance evidence index
        run: python3 -B scripts/verify_acceptance_matrix.py
      - name: Verify CLI, contracts and isolated fixture runs
        # Local encryption fixtures only; no private archive or homelab access.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age=1.1.1-1ubuntu0.24.04.3
          python3 -m unittest discover -s tests -v
      - name: Run the controlled parity job
        if: ${{ github.ref_name != 'codex/WORM-021-required-failure' && github.ref_name != 'codex/WORM-021-unexpected-success' }}
        run: python3 -B scripts/run_ci_parity.py --mode all
      - name: Prove required failure propagation
        if: ${{ github.event_name == 'push' && github.ref_name == 'codex/WORM-021-required-failure' }}
        run: python3 -B scripts/run_ci_parity.py --mode required-failure
      - name: Prove unexpected negative success propagation
        if: ${{ github.event_name == 'push' && github.ref_name == 'codex/WORM-021-unexpected-success' }}
        run: python3 -B scripts/run_ci_parity.py --mode unexpected-success
      - name: Validate staged diagnostics
        id: safe_diagnostics
        if: ${{ !cancelled() }}
        run: python3 -B -m wormhole.parity validate --output ci-artifacts
      - name: Upload validated diagnostics
        if: ${{ !cancelled() && steps.safe_diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wormhole-parity
          path: |
            ci-artifacts/plan.json
            ci-artifacts/results.json
            ci-artifacts/decision.json
            ci-artifacts/execution.json
            ci-artifacts/checksums.json
          include-hidden-files: false
          overwrite: false
          if-no-files-found: error
          retention-days: 7
